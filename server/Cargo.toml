[package]
name = "basalt-server"
description = "Basalt broker process: network, request pipeline, config, observability"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "basalt-server"
path = "src/main.rs"

[dependencies]
hmac = "0.12"
sha2 = "0.10"
regex = "1"
openraft = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyerror = "0.1"
tokio = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
basalt-protocol = { path = "../protocol" }
basalt-record = { path = "../record" }
basalt-storage = { path = "../storage" }
basalt-metadata = { path = "../metadata" }
basalt-coordinator = { path = "../coordinator" }
raft = { version = "0.7", features = ["protobuf-codec"] }
raft-proto = { version = "0.7", features = ["protobuf-codec"] }
protobuf = "2"
slog = "2"
crc32c = { workspace = true }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs", "tls12"] }
rustls-pki-types = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs"] }

[lints]
workspace = true
