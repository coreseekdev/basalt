[package]
name = "basalt-server"
description = "Basalt broker process: network, request pipeline, config, observability"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "basalt-server"
path = "src/main.rs"

[dependencies]
openraft = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyerror = "0.1"
tokio = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
basalt-protocol = { path = "../protocol" }
basalt-record = { path = "../record" }
basalt-storage = { path = "../storage" }
basalt-metadata = { path = "../metadata" }
basalt-coordinator = { path = "../coordinator" }

[lints]
workspace = true
