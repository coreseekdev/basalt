[workspace]
resolver = "2"
members = [
    "protocol",
    "record",
    "storage",
    "metadata",
    "coordinator",
    "testing",
    "server",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["The Basalt Authors"]

# 性能纪律（用户约束 + ADR-13）：
# - 生产代码禁用 Rc/RefCell/Arc（clippy.toml disallowed-types 强制）：
#   所有权经 channel 转移（partition actor 模型），共享只读态经 watch 广播的 owned 快照。
# - tokio::sync::mpsc / bytes::Bytes 内部的引用计数属于生态原语实现细节，不受此限；
#   本约束约束的是 basalt 自身的所有权图。
# - 热路径缓冲复用：per-connection BytesMut + storage::pool 尺寸类内存池。
[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crc32c = "0.6"
lz4_flex = "0.11"
zstd = "0.13"
flate2 = "1"
serde_json = "1"
rand = "0.9"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
# 保留符号，方便 perf/flamegraph 剖析
debug = true
lto = "thin"
codegen-units = 1

[profile.bench]
debug = true
